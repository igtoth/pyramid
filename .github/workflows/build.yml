name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Run by hand (Actions > build > Run workflow): with a version, the run
  # tags it and publishes the release with the installers.
  workflow_dispatch:
    inputs:
      release:
        description: "Version to release, like 3.0.1 (empty: build only)"
        required: false
        default: ""

# A newer push to main cancels the run still going; tags always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

env:
  PYTHON_VERSION: "3.12"
  RELEASE_TAG: ${{ (github.event_name == 'workflow_dispatch' && inputs.release != '') && format('v{0}', inputs.release) || (startsWith(github.ref, 'refs/tags/v') && github.ref_name || '') }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk
          pip install -e . pytest ruff Pillow playwright
      - name: Lint
        run: ruff check src tests scripts
      - name: Unit and integration tests (fake Genesys Cloud, Python and JS parity)
        run: pytest -q
      - name: Desktop app end to end (every report in the real window)
        run: xvfb-run -a -s "-screen 0 1440x900x24" python scripts/screenshots.py shots
      - name: Web page end to end (pyramid web, and the Pages site with PKCE sign-in)
        run: |
          playwright install --with-deps chromium
          python scripts/web_check.py shots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
          retention-days: 14

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x86_64
          - os: macos-latest
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x86_64
          - os: ubuntu-22.04   # the oldest glibc the build runs on
            name: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Version
        id: ver
        shell: bash
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          else
            base=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/pyramid/__init__.py)
            echo "version=${base}-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Tools
        shell: bash
        run: |
          pip install "nuitka>=2.5" certifi
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update && sudo apt-get install -y patchelf python3-tk libfuse2
          fi
          if [[ "$RUNNER_OS" == "Windows" && ! -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]]; then
            choco install innosetup --no-progress -y
          fi

      - name: Build and package
        shell: bash
        run: python scripts/build.py --version "${{ steps.ver.outputs.version }}"

      - name: Smoke test
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) exe=build/nuitka/launcher.dist/pyramid.exe ;;
            macOS)   exe=$(ls -d build/nuitka/*.app)/Contents/MacOS/pyramid-app ;;
            Linux)   exe=build/nuitka/launcher.dist/Pyramid ;;
          esac
          "$exe" --version
          "$exe" list > /dev/null
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: pyramid-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # The web version: the same page, served by GitHub Pages at
  # https://igtoth.github.io/pyramid/ (sign-in with PKCE).
  web:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Site
        run: |
          mkdir -p site
          cp -r src/pyramid/web/. site/
          cp src/pyramid/catalog.json site/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Settings > Pages > Source must be "GitHub Actions"; the job tries to
  # turn it on and does not fail the run when it cannot.
  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - id: deploy
        uses: actions/deploy-pages@v4

  # Version tags publish a release; every push to main refreshes the
  # "nightly" pre-release with that commit's downloads.
  release:
    if: (github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')) || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: docs/CHANGELOG.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: pyramid-*
          merge-multiple: true
      - name: Checksums
        run: (cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Release notes
        shell: bash
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            v="${RELEASE_TAG#v}"
            awk -v head="## [${v}]" 'index($0, head) == 1 { p = 1; next } /^## / && p { exit } p' docs/CHANGELOG.md > notes.md
          else
            echo "Downloads built from ${GITHUB_SHA} on main; replaced on every push. For a stable version take the latest release." > notes.md
          fi
          printf '\nNot code-signed yet: on Windows, SmartScreen > More info > Run anyway; on macOS, right-click > Open the first time.\nWeb version: https://igtoth.github.io/pyramid/\n' >> notes.md
          cat notes.md
      - name: Drop the previous nightly
        if: env.RELEASE_TAG == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete nightly --repo "${{ github.repository }}" --cleanup-tag --yes || true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          tag_name: ${{ env.RELEASE_TAG != '' && env.RELEASE_TAG || 'nightly' }}
          name: ${{ env.RELEASE_TAG != '' && format('Pyramid {0}', env.RELEASE_TAG) || 'Nightly build' }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ env.RELEASE_TAG == '' }}
          make_latest: ${{ env.RELEASE_TAG != '' && 'true' || 'false' }}
          body_path: notes.md
