<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://*.mypurecloud.com https://*.mypurecloud.ie https://*.mypurecloud.de https://*.mypurecloud.jp https://*.mypurecloud.com.au https://*.pure.cloud https://*.us-gov-pure.cloud https://*.eusc-pure.cloud; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Pyramid · Genesys Cloud reports</title>
  <meta name="description" content="Browse, audit and export a Genesys Cloud organization from the browser: users with their queues and roles, routing, telephony, Architect and more, as CSV or JSON.">
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="demo-banner" id="demo-banner" role="note" hidden></div>
  <nav class="maintabs" id="maintabs" role="tablist" aria-label="Pyramid">
    <span class="brand"><img src="icon-192.png" alt="" width="22" height="22"></span>
    <button type="button" role="tab" data-tab="main">Main</button>
    <button type="button" role="tab" data-tab="oauth">OAuth</button>
    <button type="button" role="tab" data-tab="config">Config</button>
    <button type="button" role="tab" data-tab="log">Log</button>
    <button type="button" role="tab" data-tab="help">Help</button>
    <button type="button" role="tab" data-tab="about">About</button>
  </nav>

  <main id="app">
    <section class="tabpanel" id="tab-main" role="tabpanel">
      <nav class="subtabs" id="subtabs" aria-label="Open reports"></nav>
      <div class="stack" id="stack"></div>
    </section>
    <section class="tabpanel" id="tab-oauth" role="tabpanel" hidden></section>
    <section class="tabpanel" id="tab-config" role="tabpanel" hidden></section>
    <section class="tabpanel" id="tab-log" role="tabpanel" hidden></section>
    <section class="tabpanel" id="tab-help" role="tabpanel" hidden></section>
    <section class="tabpanel" id="tab-about" role="tabpanel" hidden></section>
  </main>

  <footer class="statusbar">
    <span id="client-label" class="warn">No client selected</span>
    <button class="danger small" id="btn-cancel" type="button" hidden>⏹ Cancel</button>
    <span class="spacer"></span>
    <span id="status" role="status" aria-live="polite">Ready</span>
    <span class="progress" id="progress" hidden></span>
    <button class="ghost small" id="btn-theme" type="button" title="Dark / light theme">Dark</button>
  </footer>

  <dialog id="dialog">
    <form method="dialog" class="dialog-head"><h2 id="dialog-title"></h2><button class="ghost" value="close" aria-label="Close">✕</button></form>
    <div id="dialog-body" class="dialog-body"></div>
  </dialog>

  <noscript><p class="noscript">Pyramid needs JavaScript.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
